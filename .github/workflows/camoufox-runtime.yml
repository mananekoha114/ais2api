# Camoufox on Linux x64 and ARM64: setup installs it with its system packages,
# the hidden runtime, font and identity tests run under Xvfb, and the
# container image installs and verifies it on its first start. On Termux,
# setup creates the proot container Camoufox runs in. Only local pages are
# opened: no account, cookie or Google request. Each run downloads Camoufox
# (about 1.3 GB) several times, so it runs when the Camoufox code changes,
# and by hand.
name: Camoufox runtime
on:
  pull_request:
    paths:
      - '.github/workflows/camoufox-runtime.yml'
      - 'Dockerfile'
      - 'docker/**'
      - 'runtime-manifest.json'
      - 'browser/bridge.js'
      - 'browser/camoufox/**'
      - 'include/ais2api/camoufox.hpp'
      - 'include/ais2api/firefox_identity.hpp'
      - 'include/ais2api/runtime.hpp'
      - 'src/browser_process.cpp'
      - 'src/camoufox.cpp'
      - 'src/firefox_identity.cpp'
      - 'src/setup.cpp'
      - 'scripts/build.sh'
      - 'scripts/camoufox-dev.py'
      - 'scripts/ci-termux-camoufox.sh'
      - 'browser/process.hpp'
      - 'tests/test_camoufox.cpp'
      - 'tests/test_firefox_identity.cpp'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camoufox-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Camoufox / Ubuntu 24.04 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            triplet: x64-linux
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            triplet: arm64-linux
            platform: linux/arm64
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-cache
      VCPKG_ROOT: ${{ github.workspace }}/build/deps/vcpkg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Three Camoufox installs and an image need more room than the runner leaves.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl zip unzip tar pkg-config autoconf automake libtool python3 python3-venv
      # The native workflow's GCC cache on x64; its own on ARM64.
      - name: Compute dependency cache key
        id: deps
        run: echo "scope=ubuntu24-gcc-${{ matrix.triplet }}-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-
            ${{ steps.deps.outputs.scope }}-
      - name: Count restored dependency archives
        id: restored
        run: |
          mkdir -p build/vcpkg-cache
          echo "count=$(find build/vcpkg-cache -name '*.zip' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Build and test
        env:
          CC: gcc
          CXX: g++
        run: sh scripts/build.sh linux --jobs "$(nproc)"
      - name: Check for newly built dependencies
        id: built
        if: ${{ !cancelled() }}
        run: echo "changed=$(( $(find build/vcpkg-cache -name '*.zip' | wc -l) > ${{ steps.restored.outputs.count || 0 }} ))" >> "$GITHUB_OUTPUT"
      - name: Save dependency cache
        if: ${{ !cancelled() && steps.built.outputs.changed == '1' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
      - name: Install Camoufox with setup
        run: |
          set -eu
          data="$RUNNER_TEMP/data"
          config="$RUNNER_TEMP/config.json"
          # Without Xvfb, setup asks before it installs anything.
          sudo apt-get remove -y xvfb
          if AIS2API_DATA_DIR="$data" AIS2API_BROWSER_BACKEND=camoufox build/linux/ais2api setup --config "$config" > "$RUNNER_TEMP/refused.json" 2>&1; then
            echo "setup installed system packages without --yes" >&2; exit 1
          fi
          grep -q system_confirmation_required "$RUNNER_TEMP/refused.json"
          grep -q xvfb "$RUNNER_TEMP/refused.json"
          AIS2API_DATA_DIR="$data" AIS2API_BROWSER_BACKEND=camoufox build/linux/ais2api setup --yes --config "$config" > "$RUNNER_TEMP/setup.json"
          AIS2API_DATA_DIR="$data" AIS2API_BROWSER_BACKEND=camoufox build/linux/ais2api doctor --config "$config" > "$RUNNER_TEMP/doctor.json"
          python3 - "$RUNNER_TEMP/setup.json" "$RUNNER_TEMP/doctor.json" "$GITHUB_ENV" <<'EOF'
          import json, sys
          setup, doctor = (json.load(open(path, encoding='utf-8')) for path in sys.argv[1:3])
          camoufox = setup['camoufox']
          print(json.dumps({'system_packages': setup.get('system_packages'), 'version': camoufox['version'],
                            'page': camoufox['browser_verification']['page']}, indent=1))
          assert setup['system_packages']['status'] == 'installed', setup['system_packages']
          assert doctor['browser_exists'] is True and doctor['camoufox']['source'] == 'setup', doctor
          with open(sys.argv[3], 'a', encoding='utf-8') as env:
              env.write(f"AIS2API_TEST_CAMOUFOX={doctor['camoufox']['executable']}\n")
              env.write(f"AIS2API_TEST_FPGEN_MODEL={doctor['fpgen_model']['directory']}\n")
          EOF
          # Installed now: a second setup asks for nothing and installs nothing.
          AIS2API_DATA_DIR="$data" AIS2API_BROWSER_BACKEND=camoufox build/linux/ais2api setup --config "$config" > "$RUNNER_TEMP/again.json"
          grep -q '"system_packages":{"status":"ready"}' "$RUNNER_TEMP/again.json"
          grep -q '"installed_now":false' "$RUNNER_TEMP/again.json"
      - name: Camoufox runs the bridge and reads its identity under Xvfb
        run: build/linux/ais2api_tests '[.camoufox-runtime]'
      - name: The trimmed install renders text as the full build does
        run: |
          set -eu
          full=$(python3 -I scripts/camoufox-dev.py fetch --dir "$RUNNER_TEMP/camoufox-full")
          AIS2API_TEST_CAMOUFOX_FULL="$full" build/linux/ais2api_tests '[.camoufox-fonts]'
          rm -rf "$RUNNER_TEMP/camoufox-full"
      - name: Generated identities pass the camoufox package's checks
        run: |
          set -eu
          python3 -I scripts/camoufox-dev.py venv
          AIS2API_TEST_FPGEN_COUNT=200 AIS2API_TEST_FPGEN_OUTPUT="$RUNNER_TEMP/identities.jsonl" \
            build/linux/ais2api_tests '[.fpgen-model]'
          .tools/camoufox-venv/bin/python -I scripts/camoufox-dev.py check-identities \
            --executable "$AIS2API_TEST_CAMOUFOX" --identities "$RUNNER_TEMP/identities.jsonl"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ais2api:camoufox-${{ matrix.arch }}
          cache-from: type=gha,scope=ais2api-${{ matrix.arch }}
      - name: The image installs Camoufox on its first start
        env:
          IMAGE: ais2api:camoufox-${{ matrix.arch }}
        run: |
          set -eu
          data="$RUNNER_TEMP/image-data"
          mkdir -p "$data"
          docker run -d --name ais2api-camoufox --shm-size=1g -e AIS2API_BROWSER_BACKEND=camoufox \
            -p 18453:18451 -v "$data:/data" "$IMAGE"
          trap 'docker logs ais2api-camoufox 2>&1 | tail -n 100; docker rm -f ais2api-camoufox' EXIT
          # Download, extraction and the verification launch come before the service.
          for _ in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:18453/health >/dev/null 2>&1; then break; fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:18453/health
          docker logs ais2api-camoufox 2>&1 | grep -q 'installing Camoufox'
          docker logs ais2api-camoufox 2>&1 | grep -q '"browser_verification"'
          docker stop -t 30 ais2api-camoufox
          docker run --rm --entrypoint /app/bin/ais2api -e AIS2API_BROWSER_BACKEND=camoufox -v "$data:/data" "$IMAGE" \
            doctor --config /data/config.json > "$RUNNER_TEMP/image-doctor.json"
          grep -q '"browser_exists":true' "$RUNNER_TEMP/image-doctor.json"
  # Termux runs Camoufox and Xvfb in the proot container setup creates. The
  # Termux CI container runs proot; a real device remains the reference.
  termux:
    name: Camoufox / Termux ARM64 (proot)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      TERMUX_CI_IMAGE: termux/termux-docker@sha256:3a0a340fca9947f7139a0d695f1234edf0172daed6a2f1e0b1413ef91453c9ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Prepare isolated container inputs
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/termux-ci/input" "$RUNNER_TEMP/termux-ci/output"
          git archive --format=tar HEAD > "$RUNNER_TEMP/termux-ci/input/source.tar"
          chmod 0644 "$RUNNER_TEMP/termux-ci/input/source.tar"
          sudo chown 1000:1000 "$RUNNER_TEMP/termux-ci/output"
          docker pull "$TERMUX_CI_IMAGE"
      - name: Install Camoufox with setup and run it through proot
        run: |
          # proot traces the browser with ptrace. The image's root entry point
          # clears custom environment variables, as in termux.yml.
          docker run --rm --user 1000:1000 --security-opt seccomp=unconfined --shm-size=1g \
            --mount "type=bind,source=$RUNNER_TEMP/termux-ci/input/source.tar,target=/input/source.tar,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/termux-ci/output,target=/out" \
            --env AIS2API_TERMUX_CI=1 \
            "$TERMUX_CI_IMAGE" bash -lc '
              set -eu
              mkdir "$HOME/ais2api-source"
              tar -xf /input/source.tar -C "$HOME/ais2api-source"
              cd "$HOME/ais2api-source"
              sh scripts/ci-termux-camoufox.sh
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: termux-camoufox-${{ github.sha }}
          path: ${{ runner.temp }}/termux-ci/output/
          if-no-files-found: ignore
          retention-days: 7
