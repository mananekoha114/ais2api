name: Container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.name.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      # Registry references must be lowercase; repository names may not be.
      - name: Compute image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
  image:
    name: Image ${{ matrix.arch }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ais2api:ci-${{ matrix.arch }}
          labels: ${{ needs.metadata.outputs.labels }}
          cache-from: type=gha,scope=ais2api-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=ais2api-{0}', matrix.arch) || '' }}
      - name: Smoke test image
        env:
          IMAGE: ais2api:ci-${{ matrix.arch }}
        run: |
          set -eu
          data="$RUNNER_TEMP/ais2api-data"
          mkdir -p "$data"
          # A new configuration starts on Camoufox, which the entrypoint installs
          # into the data volume. This smoke checks the Chromium the image carries.
          docker run --rm --entrypoint /app/bin/ais2api \
            -e AIS2API_BROWSER_BACKEND=cloakbrowser \
            -v "$data:/data" "$IMAGE" \
            init --config /data/config.json --data-dir /data \
            --bind 0.0.0.0 --browser /usr/bin/chromium
          docker run --rm --entrypoint /app/bin/ais2api \
            -v "$data:/data" "$IMAGE" \
            doctor --config /data/config.json > "$RUNNER_TEMP/doctor.json"
          cat "$RUNNER_TEMP/doctor.json"
          grep -q '"browser_backend":"cloakbrowser"' "$RUNNER_TEMP/doctor.json"
          grep -q '"browser_exists":true' "$RUNNER_TEMP/doctor.json"
          grep -q '"code":"cloakbrowser_backend"' "$RUNNER_TEMP/doctor.json"
          docker run --rm --entrypoint /usr/bin/chromium "$IMAGE" \
            --no-sandbox --headless=new --disable-gpu --disable-dev-shm-usage \
            --dump-dom about:blank | grep -q '<html'
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            set -eu
            profile=$(mktemp -d)
            /usr/bin/chromium --no-sandbox --headless=new --disable-gpu \
              --disable-dev-shm-usage --remote-debugging-address=127.0.0.1 \
              --remote-debugging-port=0 --user-data-dir="$profile" about:blank \
              >/tmp/chromium.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            for _ in $(seq 1 30); do
              [ -f "$profile/DevToolsActivePort" ] && break
              sleep 1
            done
            if [ ! -f "$profile/DevToolsActivePort" ]; then cat /tmp/chromium.log; exit 1; fi
            port=$(sed -n 1p "$profile/DevToolsActivePort")
            curl -fsS "http://127.0.0.1:$port/json/version"
          '
          # Start from an empty volume so the entrypoint creates the config.
          fresh="$RUNNER_TEMP/ais2api-fresh"
          mkdir -p "$fresh"
          docker run -d --name ais2api-smoke \
            -p 18452:18451 -v "$fresh:/data" "$IMAGE"
          trap 'docker logs ais2api-smoke; docker rm -f ais2api-smoke' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18452/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18452/health
          curl -fsS http://127.0.0.1:18452/ | grep -q 'id="app"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18452/ready)" = 503
          # The first start must replace the public default management password.
          admin="http://127.0.0.1:18452/api/admin/v1/auth/check"
          key=$(docker logs ais2api-smoke 2>&1 | sed -n 's/^ais2api: generated management password: //p')
          test -n "$key"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer admin' "$admin")" = 401
          curl -fsS -H "Authorization: Bearer $key" "$admin" | grep -q '"password_change_required":false'
          docker stop -t 30 ais2api-smoke
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Push untagged by digest; the manifest job attaches the tags. The local
      # builder cache from the tested build makes this a re-export.
      - name: Publish architecture image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.metadata.outputs.labels }}
          outputs: type=image,name=${{ needs.metadata.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ais2api-${{ matrix.arch }}
      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  manifest:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request'
    needs: [metadata, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          TAGS: ${{ needs.metadata.outputs.tags }}
        run: |
          set -eu
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=(-t "$tag"); fi
          done <<< "$TAGS"
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[1]}"
