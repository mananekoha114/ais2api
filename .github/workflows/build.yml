name: Native builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Dependency caches are scoped to the toolchain (vcpkg ABI hashes include the compiler),
# keyed per run so newly built packages are always saved, and restored from the newest
# entry of the same scope.
jobs:
  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check scripts and browser bridge
        run: |
          sh -n scripts/build.sh
          sh -n launcher/start.sh
          python3 -m unittest discover -s tests -p 'test_launcher.py'
          python3 -m unittest discover -s tests -p 'test_check_package.py'
          python3 -m unittest discover -s tests -p 'test_pricing_scraper.py'
          node --check browser/bridge.js
          node --check browser/test_cookie_runtime.cjs
          node --test browser/test_bridge.cjs
          node --check userscript/ais2api-cookie.user.js
          node userscript/test_cookie_helper.cjs
  linux:
    name: Ubuntu 24.04 / ${{ matrix.compiler }} / sanitizers ${{ matrix.sanitize }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            sanitize: 'OFF'
          - compiler: clang
            sanitize: 'ON'
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-cache
      VCPKG_ROOT: ${{ github.workspace }}/build/deps/vcpkg
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12'
      - name: Install development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build git curl zip unzip tar pkg-config autoconf automake libtool python3
      - name: Compute dependency cache key
        id: deps
        run: echo "scope=ubuntu24-${{ matrix.compiler }}-x64-linux-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-
            ${{ steps.deps.outputs.scope }}-
      - name: Count restored dependency archives
        id: restored
        run: |
          mkdir -p build/vcpkg-cache
          echo "count=$(find build/vcpkg-cache -name '*.zip' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Build, test, and stage native runtime
        shell: bash
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
          BUILD_TYPE: ${{ matrix.sanitize == 'ON' && 'RelWithDebInfo' || 'Release' }}
        run: |
          options=()
          if [[ '${{ matrix.sanitize }}' == ON ]]; then options+=(--sanitizers); else options+=(--package); fi
          if [[ '${{ matrix.compiler }}' == clang && '${{ matrix.sanitize }}' == ON ]]; then options+=(--fuzzer); fi
          sh scripts/build.sh linux --webui --jobs "$(nproc)" "${options[@]}"
      - name: Check for newly built dependencies
        id: built
        if: ${{ !cancelled() }}
        run: echo "changed=$(( $(find build/vcpkg-cache -name '*.zip' | wc -l) > ${{ steps.restored.outputs.count || 0 }} ))" >> "$GITHUB_OUTPUT"
      - name: Save dependency cache
        if: ${{ !cancelled() && steps.built.outputs.changed == '1' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
      - name: CLI and IPC smoke without Google credentials
        run: |
          python3 tests/cli_smoke.py --exe build/linux/install/bin/ais2api
          python3 tests/portable_smoke.py --exe build/linux/install/bin/ais2api
      - name: One-click launcher smoke without a browser download
        run: |
          sh build/linux/install/start.sh --background --port 18460 --browser /usr/bin/true < /dev/null
          build/linux/install/bin/ais2api stop
      - name: Short wire-parser fuzz smoke
        if: matrix.compiler == 'clang' && matrix.sanitize == 'ON'
        run: build/linux/ais2api_fuzz_wire -max_total_time=15 -max_len=65536
      - name: Verify runtime archive contents and checksum
        if: matrix.sanitize == 'OFF'
        run: python3 scripts/check-package.py build/linux/packages/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.sanitize == 'OFF'
        with:
          name: ubuntu24-${{ matrix.compiler }}-runtime
          path: build/linux/packages/*.tar.gz*
          if-no-files-found: error
          retention-days: 28
  debian:
    name: Debian 13 / GCC x64
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-cache
      VCPKG_ROOT: ${{ github.workspace }}/build/deps/vcpkg
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian development tools
        run: |
          apt-get update
          apt-get install -y build-essential cmake ninja-build git curl zip unzip tar pkg-config autoconf automake libtool python3 ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12'
      # The container has no runner image version; fingerprint the toolchain packages instead.
      - name: Compute dependency cache key
        id: deps
        run: |
          toolchain=$(dpkg-query -W -f='${Package}=${Version}\n' gcc g++ cmake ninja-build binutils libc6-dev | sha256sum | cut -c1-16)
          echo "scope=debian13-gcc-x64-linux-$toolchain" >> "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-
            ${{ steps.deps.outputs.scope }}-
      - name: Count restored dependency archives
        id: restored
        run: |
          mkdir -p build/vcpkg-cache
          echo "count=$(find build/vcpkg-cache -name '*.zip' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Build, test, install, and package
        run: sh scripts/build.sh linux --webui --package --jobs "$(nproc)"
      - name: Check for newly built dependencies
        id: built
        if: ${{ !cancelled() }}
        run: echo "changed=$(( $(find build/vcpkg-cache -name '*.zip' | wc -l) > ${{ steps.restored.outputs.count || 0 }} ))" >> "$GITHUB_OUTPUT"
      - name: Save dependency cache
        if: ${{ !cancelled() && steps.built.outputs.changed == '1' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
      - name: CLI and IPC smoke without Google credentials
        run: |
          python3 tests/cli_smoke.py --exe build/linux/install/bin/ais2api
          python3 tests/portable_smoke.py --exe build/linux/install/bin/ais2api
      - name: One-click launcher smoke without a browser download
        run: |
          sh build/linux/install/start.sh --background --port 18460 --browser /usr/bin/true < /dev/null
          build/linux/install/bin/ais2api stop
      - name: Verify runtime archive contents and checksum
        run: python3 scripts/check-package.py build/linux/packages/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debian13-gcc-runtime
          path: build/linux/packages/*.tar.gz*
          if-no-files-found: error
          retention-days: 28
  windows:
    name: Windows / MSVC x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\build\vcpkg-cache
      VCPKG_ROOT: ${{ github.workspace }}\build\deps\vcpkg
      # Release-only dependencies halve cold vcpkg builds; CI never builds the Debug configuration.
      VCPKG_TRIPLET: x64-windows-static-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12'
      # MSVC and PowerShell are part of the vcpkg ABI and change with each runner image update.
      - name: Compute dependency cache key
        id: deps
        shell: bash
        run: echo "scope=windows-msvc-$VCPKG_TRIPLET-$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-
            ${{ steps.deps.outputs.scope }}-
      - name: Count restored dependency archives
        id: restored
        shell: bash
        run: |
          mkdir -p build/vcpkg-cache
          echo "count=$(find build/vcpkg-cache -name '*.zip' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Parse PowerShell build entry point
        shell: pwsh
        run: |
          $parseErrors = $null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/build.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw 'PowerShell syntax check failed' }
      - name: Build, test, install, and package
        shell: pwsh
        run: ./scripts/build.ps1 -Triplet $env:VCPKG_TRIPLET -Jobs $env:NUMBER_OF_PROCESSORS -Package -WebUI
      - name: Check for newly built dependencies
        id: built
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "changed=$(( $(find build/vcpkg-cache -name '*.zip' | wc -l) > ${{ steps.restored.outputs.count || 0 }} ))" >> "$GITHUB_OUTPUT"
      - name: Save dependency cache
        if: ${{ !cancelled() && steps.built.outputs.changed == '1' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/vcpkg-cache
          key: ${{ steps.deps.outputs.scope }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
      - name: CLI and IPC smoke without Google credentials
        shell: pwsh
        run: |
          python tests/cli_smoke.py --exe build/windows/install/bin/ais2api.exe
          if ($LASTEXITCODE -ne 0) { throw 'CLI smoke failed' }
          python tests/portable_smoke.py --exe build/windows/install/bin/ais2api.exe
          if ($LASTEXITCODE -ne 0) { throw 'Portable smoke failed' }
      - name: One-click launcher smoke without a browser download
        shell: cmd
        run: |
          call build\windows\install\start.cmd --background --port 18460 --browser %SystemRoot%\System32\whoami.exe < NUL || exit /b 1
          build\windows\install\bin\ais2api.exe stop
      - name: Verify runtime archive contents and checksum
        shell: pwsh
        run: |
          Get-ChildItem build/windows/packages/*.zip | ForEach-Object {
            python scripts/check-package.py $_.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Runtime archive validation failed' }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-msvc-x64-runtime
          path: build/windows/packages/*.zip*
          if-no-files-found: error
          retention-days: 28
